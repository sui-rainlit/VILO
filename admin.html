<html lang="ko"><head><meta charset="utf-8">

<style>
:root{--tx:#2d3a5a;--mu:#7b86a3;--ac:#5b7cf0;--ac2:#eef2ff;--bd:#e6ebf7;--ink:#3a4570;--gr:linear-gradient(120deg,#ffcfa8 0%,#ffbccf 35%,#bcc9ff 70%,#a8dfff 100%);--sh:0 3px 12px rgba(140,160,230,.18)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:720px;margin:0 auto;padding:14px 14px 80px}
.hero{background:var(--gr);color:var(--ink);border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--sh)}
h1{font-size:20px;margin:0}h3{font-size:14px;margin:24px 0 8px;color:var(--ac)}
button,input,select{font:inherit;color:var(--tx)}
.b{background:var(--gr);color:var(--ink);border:0;border-radius:999px;padding:8px 15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.g{background:var(--ac2);color:var(--ac)}.b.s{padding:5px 10px;font-size:12px}.b.r{background:#ffe9ec;color:#c0425a}
input[type=text],input[type=password],input[type=number],input[type=date],select{width:100%;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0}
label.l{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto}.tab{flex:none;background:var(--ac2);color:var(--ac);border:0;border-radius:12px;padding:9px 14px;font-weight:600}.tab.on{background:var(--gr);color:var(--ink)}
.mr{display:flex;gap:6px;align-items:center;margin-bottom:8px}.mr input{flex:1}
.pk{border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;gap:10px;align-items:center}
.pk img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--ac2)}.pk .e{width:64px;height:64px;border-radius:8px;background:var(--ac2)}
.fi{position:relative;overflow:hidden}.fi input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.note{font-size:12px;color:var(--mu);line-height:1.6}
.sv{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));text-align:center}
.bar{position:fixed;top:0;left:0;right:0;background:var(--ink);color:#fff;text-align:center;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;font-size:13px;z-index:30}
.tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:40;max-width:90%}
</style></head>
<body><div id="app"></div><div id="bar"></div>
<script>
let S={};try{S=JSON.parse(localStorage.getItem('gh')||'{}')}catch(e){}
let D=null,sha='',tab='profile',ed=null,busy=false;const pv={},fu=new WeakMap();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toast(t){const e=document.createElement('div');e.className='tt';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function status(t){$('#bar').innerHTML=t?'<div class="bar">'+esc(t)+'</div>':''}
function why(e){if(e&&e.status){const m={401:'토큰이 올바르지 않거나 만료됐어요',403:'권한이 없거나 요청이 너무 많아요. 토큰의 Contents 권한(Read and write)을 확인해 주세요',404:'저장소나 파일을 찾을 수 없어요. 이름과 data.json 업로드를 확인해 주세요',409:'다른 곳에서 먼저 저장돼 충돌했어요. 다시 시도해 주세요',422:'저장 요청이 거절됐어요. 다시 시도해 주세요'};return m[e.status]||'GitHub 오류 ('+e.status+')'}return '오류: '+((e&&(e.message||e.name))||'알 수 없음')}
const hdr=()=>({Authorization:'Bearer '+S.t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const url=p=>'https://api.github.com/repos/'+encodeURIComponent(S.o)+'/'+encodeURIComponent(S.r)+'/contents/'+p.split('/').map(encodeURIComponent).join('/');
const gh=(p,m,body,q)=>fetch(url(p)+(q||''),{method:m||'GET',headers:Object.assign(hdr(),body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const b64text=t=>u8b64(new TextEncoder().encode(t));
const fileb64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function load(){const res=await gh('data.json','GET',null,'?ref='+encodeURIComponent(S.b));if(!res.ok)throw res;
 const j=await res.json();sha=j.sha;let txt;
 if(j.content)txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0)));
 else txt=await (await fetch(url('data.json')+'?ref='+encodeURIComponent(S.b),{headers:Object.assign(hdr(),{Accept:'application/vnd.github.raw+json'})})).text();
 const d=JSON.parse(txt);d.site=d.site||{};d.profile=Object.assign({fields:[],bio:[]},d.profile||{});return d}
async function commitData(mut,msg){for(let n=0;n<2;n++){const d=await load();mut(d);
 const res=await gh('data.json','PUT',{message:msg,content:b64text(JSON.stringify(d,null,1)),sha,branch:S.b});
 if(res.ok){const j=await res.json();sha=j.content.sha;D=d;return}
 if(n===0&&(res.status===409||res.status===422))continue;throw res}}
async function uploadFile(f,key){const ex=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[f.type]||(f.name.split('.').pop()||'jpg').toLowerCase();
 const p='img/'+key+'-'+uid('')+'.'+ex;const res=await gh(p,'PUT',{message:'add image',content:await fileb64(f),branch:S.b});if(!res.ok)throw res;pv[p]=URL.createObjectURL(f);return p}
async function delFile(p){try{const r=await gh(p,'GET',null,'?ref='+encodeURIComponent(S.b));if(!r.ok)return;const j=await r.json();await gh(p,'DELETE',{message:'remove image',sha:j.sha,branch:S.b})}catch(e){}}
async function run(msg,fn){if(busy)return false;busy=true;status(msg);try{await fn();return true}catch(e){toast(why(e));return false}finally{busy=false;status('')}}
const prev=v=>v instanceof File?(fu.get(v)||(fu.set(v,URL.createObjectURL(v)),fu.get(v))):(v?(pv[v]||v):'');
const clone=o=>JSON.parse(JSON.stringify(o));

 +pa.map((a,n)=>'<div class="mr"><input type="text" data-pa="'+n+':name" value="'+esc(a.name)+'" placeholder="활동명" style="flex:1.4"><input type="text" data-pa="'+n+':unit" value="'+esc(a.unit)+'" placeholder="단위" style="flex:.5"><input type="number" step="any" data-pa="'+n+':points" value="'+esc(a.points)+'" placeholder="점수" style="flex:.7"></div>'
  +(a.bonuses||[]).map((b,m)=>'<div class="mr" style="padding-left:14px"><span style="font-size:12px;color:var(--mu)">보너스</span><input type="text" data-pb="'+n+':'+m+':name" value="'+esc(b.name)+'" style="flex:1.4"><input type="number" step="any" data-pb="'+n+':'+m+':points" value="'+esc(b.points)+'" style="flex:.6"><button class="b r s" data-pt="bd" data-n="'+n+'" data-m="'+m+'">삭제</button></div>').join('')
  +'<div class="mr" style="justify-content:flex-end"><label style="font-size:12px;margin-right:auto"><input type="checkbox" data-pi="'+n+'"'+(a.item?' checked':'')+'> 항목형</label><button class="b g s" data-pt="addb" data-n="'+n+'">+ 보너스</button><button class="b g s" data-pt="au" data-n="'+n+'">↑</button><button class="b g s" data-pt="av" data-n="'+n+'">↓</button><button class="b r s" data-pt="ad" data-n="'+n+'">삭제</button></div>').join('')

 +'<h3>UPGRADE · COLOR 규칙</h3><label class="l">자동 계산 시작일 (이 날짜 이후 기록부터 자동으로 획득 계산)</label><input type="date" data-ps="from" value="'+esc(ps.from)+'">'
 +'<label class="l">UPGRADE: 이 활동을</label><select data-ps="up.act">'+opts(ps.up.act)+'</select><label class="l">몇 회 진행할 때마다 1개 획득</label><input type="number" min="1" data-ps="up.per" value="'+esc(ps.up.per)+'">'
 +'<label class="l">COLOR: 이 활동을</label><select data-ps="co.act">'+opts(ps.co.act)+'</select><label class="l">몇 회 진행할 때마다 1개 획득</label><input type="number" min="1" data-ps="co.per" value="'+esc(ps.co.per)+'"><label class="l">한 달 최대 획득 개수</label><input type="number" min="1" data-ps="co.monthMax" value="'+esc(ps.co.monthMax)+'">'
 +hr('hu',ps.hu,'UPGRADE')+hr('hc',ps.hc,'COLOR')+'<p><button class="b" data-pt="savecfg">규칙·현황 저장</button></p>'
 +'<h3>'+(editing?'기록 수정':'기록 추가')+'</h3>'
 +'<label class="l">날짜</label><input type="date" data-lf="date" value="'+esc(lf.date)+'">'
 +'<label class="l">활동</label><select data-lf="act">'+opts(lf.act)+'</select>'
 +(cur&&cur.item?'':'<label class="l">횟수</label><input type="number" step="any" data-lf="qty" value="'+esc(lf.qty)+'">')+bonusN
 +'<label class="l">직접 입력 포인트 (비우면 점수표대로 자동 계산, 사용·차감은 음수)</label><input type="number" step="any" data-lf="pts" value="'+esc(lf.pts)+'">'
 +'<label class="l">메모 (오디션 이름, 이벤트 이름 등)</label><input type="text" data-lf="memo" value="'+esc(lf.memo)+'">'
 +'<p style="font-size:15px">계산 결과 <b id="pv">'+sgn(v)+' P</b></p>'
 +'<p><button class="b" data-pt="addlog">'+(editing?'수정 저장':'기록 추가')+'</button> <button class="b g" data-pt="cancel">새로 입력</button></p>'
 +'<h3>기록 보기·수정</h3><input type="month" data-lm value="'+esc(lm)+'">'
 +(mlog.length?'<div style="margin-top:8px">'+mlog.map(row).join('')+'</div>':'<p class="note">이 달 기록이 없어요.</p>')+'</div>'}
async function savePoint(msg,mut){return run(msg,async()=>{await commitData(d=>{if(!d.point)throw new Error('POINT 데이터를 먼저 불러와 주세요');mut(d.point)},'update point')})}
const setPv=()=>{const el=$('#pv');if(el)el.textContent=sgn(ptsOf(lf,pa.find(a=>a.id===lf.act)))+' P'};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-pt]');if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;render();return}
 const k=d.pt,n=+d.n,m=+d.m;
 if(k==='import'){const ok=await run('불러오는 중…',async()=>{await commitData(x=>{if(!x.point)x.point=clone(SEED)},'import point')});if(ok){pa=null;render();toast('기록을 불러왔어요')}return}
 if(k==='adda'){pa.push({id:uid('a'),name:'',unit:'회',points:0,item:false,bonuses:[]});renderPoint();return}
 if(k==='addb'){pa[n].bonuses.push({id:uid('x'),name:'',points:0});renderPoint();return}
 if(k==='bd'){pa[n].bonuses.splice(m,1);renderPoint();return}
 if(k==='au'||k==='av'){const q=k==='au'?n-1:n+1;if(q<0||q>=pa.length)return;[pa[n],pa[q]]=[pa[q],pa[n]];renderPoint();return}
 if(k==='ad'){const x=pa[n];if((D.point.log||[]).some(l=>l.act===x.id)){toast('기록에서 쓰고 있는 활동은 삭제할 수 없어요');return}pa.splice(n,1);renderPoint();return}
 if(k==='hadd'){ps[d.k].push({y:'',extra:0,used:0});renderPoint();return}
 if(k==='hdel'){ps[d.k].splice(n,1);renderPoint();return}
 if(k==='saveacts'){const acts=pa.filter(a=>a.name.trim()).map(a=>({id:a.id,name:a.name.trim(),unit:(a.unit||'').trim(),points:parseFloat(a.points)||0,item:!!a.item,bonuses:(a.bonuses||[]).filter(b=>b.name.trim()).map(b=>({id:b.id,name:b.name.trim(),points:parseFloat(b.points)||0}))}));
  const ok=await savePoint('저장 중…',p=>{p.activities=acts});if(ok){pa=null;renderPoint();toast('저장했어요')}return}
 if(k==='savecfg'){const hold=r=>{const o={};r.forEach(x=>{if(/^\d{4}$/.test(String(x.y).trim()))o[String(x.y).trim()]={extra:+x.extra||0,used:+x.used||0}});return o};
  const rules={from:ps.from,upgrade:{act:ps.up.act,per:+ps.up.per||3},color:{act:ps.co.act,per:+ps.co.per||4,monthMax:+ps.co.monthMax||1}},hu=hold(ps.hu),hc=hold(ps.hc);
  const ok=await savePoint('저장 중…',p=>{p.rules=rules;p.holdings={upgrade:hu,color:hc}});if(ok){pa=null;renderPoint();toast('저장했어요')}return}
 if(k==='addlog'){if(!lf.date||!lf.act){toast('날짜와 활동을 선택해 주세요');return}
  const bon={};Object.keys(lf.bon||{}).forEach(i=>{if(+lf.bon[i]>0)bon[i]=+lf.bon[i]});
  const en={id:lf.id,date:lf.date,act:lf.act,qty:+lf.qty||0,pts:hasPts(lf)?+lf.pts:'',memo:lf.memo.trim(),bon};const ex=(D.point.log||[]).some(x=>x.id===en.id);
  const ok=await savePoint('저장 중…',p=>{p.log=p.log||[];const i=p.log.findIndex(x=>x.id===en.id);if(i>=0)p.log[i]=en;else p.log.push(en)});
  if(ok){const dt=lf.date,ac=lf.act;lm=dt.slice(0,7);lf=newLog();lf.date=dt;lf.act=ac;renderPoint();toast(ex?'수정했어요':'기록했어요')}return}
 if(k==='cancel'){lf=newLog();renderPoint();return}
 if(k==='edit'){const x=D.point.log.find(y=>y.id===d.id);lf=clone(x);if(lf.pts==null)lf.pts='';lf.bon=lf.bon||{};if(lf.date.length===7)lf.date+='-01';renderPoint();window.scrollTo(0,document.body.scrollHeight*0.55);return}
 if(k==='del'){if(!t.dataset.c){t.dataset.c=1;t.textContent='한 번 더';return}
  const ok=await savePoint('삭제 중…',p=>{p.log=(p.log||[]).filter(x=>x.id!==d.id)});if(ok)renderPoint()}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.pa){const[n,f]=d.pa.split(':');pa[+n][f]=t.value}
 else if(d.pb){const[n,m,f]=d.pb.split(':');pa[+n].bonuses[+m][f]=t.value}
 else if(d.hr){const[k,n,f]=d.hr.split(':');ps[k][+n][f]=t.value}
 else if(d.ps){const p=d.ps.split('.');if(p.length===2)ps[p[0]][p[1]]=t.value;else ps[p[0]]=t.value}
 else if(d.lf){lf[d.lf]=t.value;if(d.lf!=='memo'&&d.lf!=='date')setPv()}
 else if(d.lb){lf.bon[d.lb]=t.value;setPv()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.pi!==undefined){pa[+d.pi].item=t.checked;return}
 if(d.lf==='act'){lf.act=t.value;lf.bon={};renderPoint();return}
 if(d.lm!==undefined){lm=t.value;renderPoint();return}
 if(d.ps&&t.tagName==='SELECT'){const p=d.ps.split('.');ps[p[0]][p[1]]=t.value}});
async function save(){
 const ok=await run('저장 중…',async()=>{
  const old=clone(D),n=ed.site,p=ed.profile;let tot=0,dn=0;
  IMGS.forEach(([g,k])=>{if(ed[g][k] instanceof File)tot++});
  for(const[g,k]of IMGS){const v=ed[g][k];if(v instanceof File){status('사진 업로드 중 ('+(++dn)+'/'+tot+')');ed[g][k]=await uploadFile(v,k)}}
  status('저장 중…');
  await commitData(d=>{d.site=Object.assign(d.site||{},ed.site);d.profile=Object.assign(d.profile||{},ed.profile)},'update profile');
  for(const[g,k]of IMGS){const o=old[g]&&old[g][k];if(o&&o!==ed[g][k])await delFile(o)}
 });
 if(ok){ed=null;render();toast('저장했어요. 사이트에는 1~2분 뒤 반영돼요')}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a],[data-rm],[data-ru],[data-rv],[data-rd],[data-ra]');if(!t)return;const d=t.dataset;
 if(d.rm){const[g,k]=d.rm.split(':');ed[g][k]='';render();return}
 if(d.ra){ed.profile[d.ra].push(d.ra==='fields'?{k:'',v:''}:{d:'',t:''});render();return}
 const s=d.ru||d.rv||d.rd;if(s){const[k,ns]=s.split(':'),n=+ns,a=ed.profile[k];
  if(d.rd)a.splice(n,1);else{const m=d.ru?n-1:n+1;if(m<0||m>=a.length)return;[a[n],a[m]]=[a[m],a[n]]}render();return}
 const a=d.a;
 if(a==='connect'){S={o:$('#o').value.trim(),r:$('#r').value.trim(),b:$('#b').value.trim()||'main',t:$('#t').value.trim()};
  if(!S.o||!S.r||!S.t){toast('모두 입력해 주세요');return}
  await run('연결 중…',async()=>{D=await load();localStorage.setItem('gh',JSON.stringify(S));ed=null;render()});return}
 if(a==='disc'){localStorage.removeItem('gh');S={};D=null;ed=null;render();return}
 if(a==='save')save()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.f){const[g,k]=d.f.split(':');ed[g][k]=t.value}
 else if(d.r){const[k,n,f]=d.r.split(':');ed.profile[k][+n][f]=t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.p&&t.files[0]){const[g,k]=t.dataset.p.split(':');ed[g][k]=t.files[0];render()}});
(async()=>{if(S.o&&S.r&&S.t){await run('불러오는 중…',async()=>{D=await load()})}render()})();
</script></body></html>
