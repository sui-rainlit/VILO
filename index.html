<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>요츠보시 학원</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
:root{--cw:640px;--tx:#2d3a5a;--mu:#7b86a3;--ac:#5b7cf0;--ac2:#eef2ff;--bd:#e6ebf7;--ink:#3a4570;--gr:linear-gradient(120deg,#ffcfa8 0%,#ffbccf 35%,#bcc9ff 70%,#a8dfff 100%);--sh:0 4px 16px rgba(140,160,230,.2);--fb:"NanumSquare","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--fh:"NanumSquare","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:#fff;color:var(--tx);font-family:var(--fb);font-synthesis:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
/* login */
.lg{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px;padding:8vh 24px;background:radial-gradient(circle at 15% 10%,#ffe6d2 0,transparent 45%),radial-gradient(circle at 90% 85%,#cfe7ff 0,transparent 50%),#fff;transition:opacity .55s}
.lg.out{opacity:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.logo{max-width:240px;max-height:120px;object-fit:contain}.logo.ph{width:240px;height:100px;border:1.5px dashed #c5cdea;border-radius:0;display:flex;align-items:center;justify-content:center;color:var(--mu);letter-spacing:.2em;font-size:13px}
.lb{width:100%;max-width:210px;text-align:center}
.lb .k{font-size:10px;letter-spacing:.3em;color:var(--mu);margin-top:12px}.lb .v{font-size:16px;border-bottom:1px solid var(--bd);padding:2px 0 8px}
.go{margin-top:22px;width:100%;border:0;border-radius:0;padding:11px;background:var(--gr);color:var(--ink);font-size:14px;letter-spacing:.14em;box-shadow:var(--sh)}
.go:active{transform:scale(.97)}
/* shell */
.nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.ni{width:var(--cw);max-width:100%;height:52px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:0 14px}
.nav .logo{max-height:30px;max-width:80px}.nav .logo.ph{width:64px;height:30px;font-size:9px;letter-spacing:.1em;flex:none}
.nav .m{display:flex;align-items:center;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.nav .m::-webkit-scrollbar{display:none}
.nav a,.nav .out{flex:none;display:flex;align-items:center;justify-content:center;height:32px;line-height:1;padding:0 10px;font-size:12px;letter-spacing:.04em;text-decoration:none}
.nav a{color:var(--mu)}
.nav a.on{background:var(--gr);color:var(--ink)}
.nav .out{border:0;background:none;color:var(--mu);padding:0 0 0 8px}
.w{width:var(--cw);max-width:100%;margin:0 auto;padding:16px 14px 60px}
h2{font-family:var(--fh);font-size:18px;margin:30px 0 12px}
/* profile */
.pf-top{margin-top:6px}.pf-sub{font-size:13px;color:var(--mu)}.pf-name{font-size:32px;line-height:1.2;margin:4px 0 12px}.pf-intro{font-size:13px;line-height:1.9}
.pf-sec{display:flex;align-items:center;gap:10px;margin:28px 0 12px;color:var(--ac);font-size:13px;letter-spacing:.08em}
.pf-sec i{flex:1;height:1px;background:var(--ac);opacity:.45}
.pf-sec:after{content:"";width:8px;height:8px;border:1.5px solid var(--ac);transform:rotate(45deg)}
.idc{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.ph3{width:150px;background:linear-gradient(160deg,#fff1e6,#e8f1ff);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;letter-spacing:.1em;text-align:center}
.ph3 img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.rows{margin:0}.rw{display:flex;align-items:baseline;padding:7px 0;font-size:13px}
.kk{width:112px;flex:none;display:flex;align-items:baseline;gap:6px}.kk .dots{flex:1;border-bottom:1px dotted #aeb9e2}
.rw .v{flex:1;margin-left:8px;color:var(--ac);font-weight:700;word-break:keep-all}
.idwrap{width:340px;max-width:100%}
.idimg{aspect-ratio:577/399;border-radius:0;overflow:hidden;box-shadow:var(--sh);background:var(--ac2);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;letter-spacing:.15em}
.idimg img{width:100%;height:100%;object-fit:contain;display:block}
.idact{display:flex;gap:8px;justify-content:center;margin-top:14px}
.ab{border:0;border-radius:0;padding:9px 20px;background:var(--ac2);color:var(--ac);font-size:14px;text-decoration:none;display:inline-block}
.tt{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:0;font-size:13px;z-index:60;max-width:90%}
.pth{border-radius:0;padding:22px 18px;background:var(--gr);color:var(--ink);box-shadow:var(--sh);position:relative;overflow:hidden}
.pth:after{content:"";position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:0;background:rgba(255,255,255,.3)}
.pth>*{position:relative;z-index:1}.pth .lab{font-size:13px;opacity:.85}.pth .big{font-size:46px;line-height:1.1;margin:6px 0 10px}.pth .big small{font-size:18px;margin-left:4px}
.pth .row{display:flex;gap:16px;font-size:13px;flex-wrap:wrap}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hb{background:rgba(255,255,255,.62);border-radius:0;padding:12px 14px;font-size:13px}
.hb h4{margin:0 0 8px;font-size:13px;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:baseline}.hb h4 b{font-size:18px;letter-spacing:0}
.hb .hr{display:flex;justify-content:space-between;padding:3px 0;border-top:1px dotted rgba(58,69,112,.2)}
.hb .nt{font-size:11px;opacity:.7;margin-top:6px}
details.yr{margin-top:10px;border:1px solid var(--bd);border-radius:0;background:#fff;box-shadow:var(--sh)}
details.yr>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:14px 16px;font-size:17px}
details.yr>summary::-webkit-details-marker{display:none}
details.yr[open]>summary{border-bottom:1px solid var(--bd)}
.mo{padding:6px 16px 10px}.mh{display:flex;justify-content:space-between;margin-top:12px;padding:8px 12px;border-radius:0;background:var(--ac2);color:var(--ac);font-size:14px}
.lgr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:9px 2px;border-bottom:1px dotted var(--bd);font-size:14px}
.lgr .s{display:block;font-size:12px;color:var(--mu);margin-top:1px}.lgr .p{text-align:right;white-space:nowrap}.lgr .p.neg{color:#d4566b}
@media(max-width:420px){.hg{grid-template-columns:1fr}}
.sr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}.sr::-webkit-scrollbar{display:none}
.chp{flex:none;border:1px solid var(--bd);background:#fff;border-radius:0;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;color:var(--tx)}
.chp.on{background:var(--gr);background-origin:border-box;color:var(--ink);border-color:transparent}
.cin{width:100%;border:1px solid var(--bd);border-radius:0;padding:9px 12px;font:inherit;margin:2px 0 8px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.cc{border:0;padding:0;border-radius:0;overflow:hidden;position:relative;line-height:0;cursor:pointer;background:var(--ac2);box-shadow:var(--sh)}
.cc img{width:100%;height:100%;object-fit:cover;display:block}
.bd2{position:absolute;top:5px;right:5px;background:var(--gr);color:var(--ink);font-size:10px;padding:1px 7px;border-radius:0;line-height:1.5}
.cd-ov{position:fixed;inset:0;background:rgba(40,50,90,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.cd-sh{background:#fff;width:min(100%,var(--cw));max-height:92%;overflow:auto;border-radius:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.cd-ov{align-items:center}.cd-sh{border-radius:0}}
.cd-hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.cd-hd h3{margin:0;font-size:17px;font-weight:400}
.cd-tg{font-size:12px;color:var(--mu);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}.cd-tg span{background:var(--ac2);color:var(--ac);border-radius:0;padding:1px 8px}
.cd-sh h4{font-size:13px;margin:16px 0 8px;color:var(--ac);font-weight:400}
.cd-pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start}.cd-pg .full{grid-column:1/-1}
.cd-t{border:1px solid var(--bd);border-radius:0;padding:8px}.cd-t img{width:100%;height:auto;display:block;border-radius:0}
.cd-r{display:flex;justify-content:flex-end;align-items:center;margin-top:6px;font-size:12px;gap:4px}
.cd-b{border:0;border-radius:0;padding:6px 11px;font:inherit;font-size:12px;background:var(--ac2);color:var(--ac);cursor:pointer;text-decoration:none;display:inline-block}
.ddrow{display:flex;gap:8px;margin:2px 0 8px}
.ddb{flex:1;display:inline-flex;align-items:center;justify-content:flex-start;gap:8px;border:1px solid var(--bd);background:#fff;padding:10px 12px;font:inherit;font-size:13px;line-height:1.1;color:var(--tx);cursor:pointer;min-width:0}
.ddb span{color:var(--mu);flex:none}.ddb b{flex:1;text-align:left;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ddb i{font-style:normal;font-size:9px;color:var(--mu);flex:none}
.ddb.open{border-color:var(--ac)}
.ddl{border:1px solid var(--bd);background:#fff;max-height:240px;overflow:auto;margin-bottom:8px}
.ddo{display:flex;align-items:center;width:100%;border:0;border-bottom:1px solid var(--bd);background:#fff;padding:11px 12px;font:inherit;font-size:13px;line-height:1.1;cursor:pointer;color:var(--tx);text-align:left}
.ddo.on{background:var(--gr);background-origin:border-box;color:var(--ink)}
.chp,.cd-b,.go,.ab,.more{display:inline-flex;align-items:center;justify-content:center;line-height:1.1;text-align:center}
.go{display:flex}
.sw{display:inline-block;width:12px;height:12px;border-radius:0;margin-right:6px;vertical-align:-1px;border:1px solid var(--bd)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--bd)}
.tl li{position:relative;padding:0 0 18px 16px}.tl li:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:0;background:var(--gr);box-shadow:0 0 0 3px #fff}
.tl .d{font-size:12px;color:var(--mu)}.tl .t{font-size:15px;margin-top:2px}
.soon{border:1.5px dashed #c5cdea;border-radius:0;padding:48px 16px;text-align:center;color:var(--mu);line-height:1.8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chips span{background:var(--ac2);color:var(--ac);border-radius:0;padding:6px 13px;font-size:13px}
</style></head>
<body><div id="app"></div>
<script>
const NAV=[['profile','PROFILE'],['point','POINT'],['coord','COORD'],['photo','PHOTO CARD'],['idol','IDOL CARD'],['unit','UNIT']];
let D={site:{},profile:{fields:[],bio:[]}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo=c=>D.site.logo?'<img class="logo" src="'+esc(D.site.logo)+'" alt="VILO">':'<div class="logo ph">VILO LOGO</div>';
const authed=()=>{try{return sessionStorage.getItem('in')==='1'}catch(e){return false}};
const COL=['#ffb88c','#ff9fbd','#a9b8ff','#8fd3ff','#ffe58a'];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fx={st:[],x:null,t:0,
 mk(){return{x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:3+Math.random()*7,p:Math.random()*6.28,s:.8+Math.random()*1.6,vy:-(.1+Math.random()*.25),c:COL[Math.random()*5|0],amb:1,life:1,rot:Math.random()}},
 start(){const c=$('#fx');if(!c)return;const x=this.x=c.getContext('2d');const fit=()=>{const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)};fit();addEventListener('resize',fit);
  this.st=[];if(!RM)for(let i=0;i<36;i++)this.st.push(this.mk());this.last=performance.now();requestAnimationFrame(n=>this.loop(n))},
 burst(px,py){if(RM)return;for(let i=0;i<70;i++){const a=Math.random()*6.28,v=2+Math.random()*6;this.st.push({x:px,y:py,r:4+Math.random()*9,p:0,s:0,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,c:COL[Math.random()*5|0],amb:0,life:1,rot:Math.random()})}},
 loop(n){const c=$('#fx');if(!c)return;const x=this.x,dt=Math.min(40,n-this.last)/16;this.last=n;x.clearRect(0,0,innerWidth,innerHeight);
  this.st=this.st.filter(o=>o.amb||o.life>0);
  for(const o of this.st){let al;
   if(o.amb){o.y+=o.vy*dt;if(o.y<-12){o.y=innerHeight+12;o.x=Math.random()*innerWidth}al=.3+.5*Math.sin(n/1000*o.s+o.p)}
   else{o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=.09*dt;o.vx*=.985;o.life-=.014*dt;al=Math.max(0,o.life)}
   x.globalAlpha=Math.max(0,Math.min(1,al));x.fillStyle=o.c;x.shadowColor=o.c;x.shadowBlur=8;
   x.beginPath();const rot=o.rot*6.28+(o.amb?0:n/400);for(let i=0;i<8;i++){const a=rot+i*Math.PI/4,r=i%2?o.r*.3:o.r;x.lineTo(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r)}x.closePath();x.fill()}
  x.globalAlpha=1;requestAnimationFrame(m=>this.loop(m))}};
function login(){
 $('#app').innerHTML='<canvas id="fx"></canvas><div class="lg" id="lg"><div>'+logo()+'</div><div class="lb"><div class="k">SCHOOL</div><div class="v">'+esc(D.site.school)+'</div><div class="k">ID</div><div class="v">'+esc(D.site.id)+'</div><button class="go" id="go">Log In</button></div></div>';fx.start()}
function go(){const b=$('#go');b.disabled=true;const r=b.getBoundingClientRect();fx.burst(r.left+r.width/2,r.top+r.height/2);
 setTimeout(()=>$('#lg').classList.add('out'),RM?0:450);
 setTimeout(()=>{try{sessionStorage.setItem('in','1')}catch(e){}location.hash='#/profile';route()},RM?300:1100)}
function page(r){if(r==='point')return pointPage();const P=D.profile||{};const nick=((P.fields||[]).find(f=>f.k==='닉네임')||{}).v;const val=v=>{const m=/^#?([0-9a-f]{6})$/i.exec((v||'').trim());return (m?'<i class="sw" style="background:#'+m[1]+'"></i>':'')+esc(v)};
 if(r==='profile'){const rows=(P.fields||[]).filter(f=>f.k!=='닉네임'),sec=t=>'<div class="pf-sec"><span>'+t+'</span><i></i></div>';
  return '<div class="pf-top">'+(P.sub?'<div class="pf-sub">'+esc(P.sub)+'</div>':'')+'<div class="pf-name">'+esc(nick||D.site.id)+'</div>'+(P.intro?'<div class="pf-intro">'+esc(P.intro).replace(/\n/g,'<br>')+'</div>':'')+'</div>'
  +sec('PROFILE')+'<div class="idc"><div class="ph3">'+(P.appearance?'<img src="'+esc(P.appearance)+'" alt="">':'외관 사진')+'</div><div class="rows">'+rows.map(f=>'<div class="rw"><span class="kk"><span>'+esc(f.k)+'</span><span class="dots"></span></span><span class="v">'+val(f.v)+'</span></div>').join('')+'</div></div>'
  +sec('학생증')+'<div class="idwrap"><div class="idimg">'+(P.idcard?'<img src="'+esc(P.idcard)+'" alt="학생증">':'학생증 사진')+'</div>'+(P.idcard?'<div class="idact"><a class="ab" href="'+esc(P.idcard)+'" download="학생증.'+esc((P.idcard.split('.').pop()||'png').toLowerCase())+'">저장</a><button class="ab" id="cpid" data-src="'+esc(P.idcard)+'">복사</button></div>':'')+'</div>'
  +sec('HISTORY')+((P.bio||[]).length?'<ol class="tl">'+P.bio.map(b=>'<li><div class="d">'+esc(b.d)+'</div><div class="t">'+esc(b.t)+'</div></li>').join('')+'</ol>':'<div class="soon">아직 등록된 기록이 없어요</div>')}
 if(r==='coord')return coordPage();
 const n=(NAV.find(x=>x[0]===r)||['',''])[1];return '<div class="soon">'+esc(n)+'<br>준비 중이에요</div>'}
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ko-KR');
const sgn=n=>(n>0?'+':'')+fmt(n);
function autoEarn(P){const R=P.rules||{},from=R.from||'9999-99',out={upgrade:{},color:{}};
 const L=(P.log||[]).filter(e=>(e.date||'')>=from).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
 if(R.upgrade&&R.upgrade.act&&R.upgrade.per>0){let c=0,got=0;L.forEach(e=>{if(e.act===R.upgrade.act){c+=+e.qty||0;const n=Math.floor(c/R.upgrade.per);if(n>got){const y=(e.date||'').slice(0,4);out.upgrade[y]=(out.upgrade[y]||0)+n-got;got=n}}})}
 if(R.color&&R.color.act&&R.color.per>0){const bm={};L.forEach(e=>{if(e.act===R.color.act){const m=(e.date||'').slice(0,7);bm[m]=(bm[m]||0)+(+e.qty||0)}});
  const ms=Object.keys(bm).sort();if(ms.length){const t=new Date(),cur=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'),end=ms[ms.length-1]>cur?ms[ms.length-1]:cur;let pool=0,y=+ms[0].slice(0,4),m=+ms[0].slice(5);
   for(let g=0;g<600;g++){const key=y+'-'+String(m).padStart(2,'0');pool+=bm[key]||0;let k=0;while(pool>=R.color.per&&k<(R.color.monthMax||1)){pool-=R.color.per;k++;out.color[y]=(out.color[y]||0)+1}
    if(key>=end)break;m++;if(m>12){m=1;y++}}}}
 return out}
function holdRows(P,kind){const H=(P.holdings||{})[kind]||{},A=autoEarn(P)[kind]||{},ys=[...new Set([...Object.keys(H),...Object.keys(A)])].sort();let got=0,used=0;
 const rows=ys.map(y=>{const g=((H[y]||{}).extra||0)+(A[y]||0),u=(H[y]||{}).used||0;got+=g;used+=u;return{y,g,u}}).filter(r=>r.g||r.u);return{rows,got,used}}
function pointPage(){const P=D.point;if(!P||!(P.activities||[]).length)return '<div class="soon">POINT<br>아직 설정 전이에요</div>';
 const A={};P.activities.forEach((a,i)=>{a._i=i;A[a.id]=a});const L=P.log||[];
 const pts=e=>{const a=A[e.act];let v;if(e.pts!==''&&e.pts!=null&&!isNaN(e.pts))v=+e.pts;else if(a){v=a.points*(+e.qty||0);(a.bonuses||[]).forEach(b=>{v+=b.points*((e.bon||{})[b.id]||0)})}else v=0;return a&&a.minus?-Math.abs(v):v};
 let earn=0,spend=0;const Y={};
 L.forEach((e,i)=>{const v=pts(e);if(v>=0)earn+=v;else spend+=v;const ym=(e.date||'0000-00').slice(0,7),y=ym.slice(0,4),yy=Y[y]||(Y[y]={t:0,M:{}});yy.t+=v;const mo=yy.M[ym]||(yy.M[ym]={t:0,E:[]});mo.t+=v;mo.E.push({e,i,v})});
 const hb=(k,t)=>{const h=holdRows(P,k);return '<div class="hb"><h4><span>'+t+'</span><span>보유 <b>'+(h.got-h.used)+'</b></span></h4>'+(h.rows.length?h.rows.map(r=>'<div class="hr"><span>'+r.y+'</span><span>('+r.u+'/'+r.g+')</span></div>').join(''):'<div class="hr"><span>아직 없어요</span><span></span></div>')+'<div class="nt">(사용/획득)</div></div>'};
 const row=({e,v})=>{const a=A[e.act]||{name:'(삭제된 활동)',unit:'',points:0};let main,sub=[];
  if(a.item){main=e.memo||a.name;if(e.memo)sub.push(a.name)}else{main=a.name+' '+fmt(+e.qty||0)+(a.unit||'');if(e.memo)sub.push(e.memo)}
  if(!(e.pts!==''&&e.pts!=null&&!isNaN(e.pts))){let c=a.item?'기본 '+fmt(a.points):fmt(+e.qty||0)+(a.unit||'')+' × '+fmt(a.points);(a.bonuses||[]).forEach(b=>{const n=(e.bon||{})[b.id];if(n)c+=a.item?' + '+b.name+' '+fmt(b.points*n):' + '+b.name+' '+fmt(n)+'회 × '+fmt(b.points)});sub.unshift(c)}
  return '<div class="lgr"><span>'+esc(main)+(sub.length?'<span class="s">'+esc(sub.join(' · '))+'</span>':'')+'</span><span class="p'+(v<0?' neg':'')+'">'+sgn(v)+'P</span></div>'};
 const ys=Object.keys(Y).sort();
 return '<div class="pth"><div class="lab">현재 보유 포인트</div><div class="big">'+fmt(earn+spend)+'<small>P</small></div><div class="row"><span>누적 적립 +'+fmt(earn)+'</span><span>사용 '+fmt(spend)+'</span></div><div class="hg">'+hb('upgrade','UPGRADE')+hb('color','COLOR')+'</div></div>'
 +'<h2>기록</h2>'+(ys.length?ys.map((y,k)=>'<details class="yr"'+(k===ys.length-1?' open':'')+'><summary><span>'+y+'</span><span>'+sgn(Y[y].t)+'P</span></summary>'+Object.keys(Y[y].M).sort().map(ym=>{const mo=Y[y].M[ym];mo.E.sort((a,b)=>((A[a.e.act]||{_i:99})._i-(A[b.e.act]||{_i:99})._i)||a.i-b.i);return '<div class="mo"><div class="mh"><span>'+(+ym.slice(5))+'월</span><span>'+sgn(mo.t)+'P</span></div>'+mo.E.map(row).join('')+'</div>'}).join('')+'</details>').join(''):'<div class="soon">아직 기록이 없어요</div>')
}
let cs=0,cb='',cr='',cq='';
const CPT=[['top','상의'],['bottom','하의'],['shoes','슈즈'],['acc','악세']];
const cext=p=>(p.split('.').pop()||'jpg').toLowerCase();
function coordPage(){const C=D.coord;if(!C||!(C.series||[]).length)return '<div class="soon">COORD<br>아직 설정 전이에요</div>';if(cs>=C.series.length)cs=0;
 return '<div class="sr">'+C.series.map((x,n)=>'<button class="chp'+(n===cs?' on':'')+'" data-cs="'+n+'">'+esc(x.name)+'</button>').join('')+'</div><input class="cin" id="cq" type="search" placeholder="이름·번호 검색" value="'+esc(cq)+'"><div id="cch"></div><div id="cg"></div>'}
let ddo='';
function coordRefresh(){const S=D.coord.series[cs],defs=[['cb',S.catLabel||'분류',S.cats||[],cb],['cr','레어도',S.rarities||[],cr]].filter(x=>x[2].length);
 const bar='<div class="ddrow">'+defs.map(x=>'<button class="ddb'+(ddo===x[0]?' open':'')+'" data-dd="'+x[0]+'"><span>'+esc(x[1])+'</span><b>'+esc(x[3]?(x[2].find(y=>y.id===x[3])||{name:'전체'}).name:'전체')+'</b><i>'+(ddo===x[0]?'▲':'▼')+'</i></button>').join('')+'</div>';
 const op=defs.find(x=>x[0]===ddo);
 $('#cch').innerHTML=bar+(op?'<div class="ddl"><button class="ddo'+(op[3]?'':' on')+'" data-'+op[0]+'="">전체</button>'+op[2].map(x=>'<button class="ddo'+(op[3]===x.id?' on':'')+'" data-'+op[0]+'="'+x.id+'">'+esc(x.name)+'</button>').join('')+'</div>':'');coordGrid()}
function coordGrid(){const S=D.coord.series[cs],rar=S.rarities||[],ri=id=>rar.findIndex(x=>x.id===id);
 const l=(S.items||[]).filter(i=>(!cq||((i.name||'')+' '+(i.no||'')).toLowerCase().includes(cq.toLowerCase()))&&(!cb||i.cat===cb)&&(!cr||i.rarity===cr))
  .sort((a,b)=>ri(b.rarity)-ri(a.rarity)||(!a.no)-(!b.no)||String(a.no||'').localeCompare(String(b.no||''),'ko',{numeric:true})||(a.name||'').localeCompare(b.name||'','ko'));
 $('#cg').innerHTML=l.length?'<div class="cgrid">'+l.map(i=>'<button class="cc" data-ci="'+esc(i.id)+'" style="aspect-ratio:'+esc(S.ratio||'180/262')+'">'+(i.top?'<img loading="lazy" src="'+esc(i.top)+'" alt="'+esc(i.name)+'">':'')+((i.reprints||[]).length?'<span class="bd2">복각 '+i.reprints.length+'</span>':'')+'</button>').join('')+'</div>':'<div class="soon">'+((S.items||[]).length?'조건에 맞는 카드가 없어요':'아직 등록된 카드가 없어요')+'</div>'}
function ctile(p,label,nm,full){return '<div class="cd-t'+(full?' full':'')+'"><img src="'+esc(p)+'" alt=""><div class="cd-r"><span></span><span><a class="cd-b" href="'+esc(p)+'" download="'+esc(nm+'_'+label+'.'+cext(p))+'">저장</a> <button class="cd-b" data-cp="'+esc(p)+'">복사</button></span></div></div>'}
function coordView(id){const S=D.coord.series[cs],i=(S.items||[]).find(x=>x.id===id);if(!i)return;const P=S.mode==='single'?[['top','스윙']]:CPT,cat=(S.cats||[]).find(x=>x.id===i.cat),ra=(S.rarities||[]).find(x=>x.id===i.rarity);
 const parts=(o,nm)=>'<div class="cd-pg">'+P.map(([k,n])=>o[k]?ctile(o[k],n,nm,P.length===1):'').join('')+'</div>';
 let m=document.getElementById('cm');if(!m){m=document.createElement('div');m.id='cm';document.body.appendChild(m)}
 m.innerHTML='<div class="cd-ov" data-cclose><div class="cd-sh"><div class="cd-hd"><div><h3>'+esc(i.name)+'</h3><div class="cd-tg">'+(i.no?'<span>No.'+esc(i.no)+'</span>':'')+(cat?'<span>'+esc(cat.name)+'</span>':'')+(ra?'<span>'+esc(ra.name)+'</span>':'')+'</div></div><button class="cd-b" data-cclose>닫기</button></div><h4>원본</h4>'+parts(i,i.name)+(i.reprints||[]).map((r,n)=>'<h4>복각 · '+esc(r.label||(n+1))+'</h4>'+parts(r,i.name+'_복각'+(n+1))).join('')+'</div></div>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-cs],[data-cb],[data-cr],[data-ci],[data-cclose],[data-cp],[data-dd]');if(!t)return;const d=t.dataset;
 if(d.cclose!==undefined){if(t.tagName==='BUTTON'||e.target===t){const m=document.getElementById('cm');if(m)m.innerHTML=''}return}
 if(d.cs!==undefined){cs=+d.cs;cb='';cr='';cq='';ddo='';document.querySelector('.w').innerHTML=coordPage();coordRefresh();return}
 if(d.dd){ddo=ddo===d.dd?'':d.dd;coordRefresh();return}
 if(d.cb!==undefined){cb=d.cb;ddo='';coordRefresh();return}if(d.cr!==undefined){cr=d.cr;ddo='';coordRefresh();return}
 if(d.ci){coordView(d.ci);return}if(d.cp)copyImg(d.cp)});
document.addEventListener('input',e=>{if(e.target.id==='cq'){cq=e.target.value;coordGrid()}});
function route(){
 if(!authed()){login();return}
 const r=(location.hash.replace('#/','')||'profile');
 $('#app').innerHTML='<div class="nav"><div class="ni">'+logo()+'<div class="m">'+NAV.map(x=>'<a href="#/'+x[0]+'"'+(x[0]===r?' class="on"':'')+'>'+x[1]+'</a>').join('')+'</div><button class="out" id="lo">Log Out</button></div></div><div class="w">'+page(r)+'</div>';
 if(r==='coord')coordRefresh();const a=document.querySelector('.nav a.on');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0)}
function toast(t){const e=document.createElement('div');e.className='tt';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
async function copyImg(p){try{const bl=await (await fetch(p)).blob(),bm=await createImageBitmap(bl),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);const png=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);toast('복사했어요')}catch(e){toast('복사가 안 되면 이미지를 길게 눌러 복사하세요')}}
document.addEventListener('click',e=>{if(e.target.id==='cpid')copyImg(e.target.dataset.src);if(e.target.id==='go')go();if(e.target.id==='lo'){try{sessionStorage.removeItem('in')}catch(x){}location.hash='';route()}});
window.addEventListener('hashchange',route);
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;document.title=(d.site&&d.site.school)||'요츠보시 학원';route()}).catch(()=>{$('#app').innerHTML='<div class="soon" style="margin:40px 16px">데이터를 불러오지 못했어요.<br>잠시 후 다시 시도해 주세요.</div>'});
</script></body></html>
